<!DOCTYPE html>

    <title>翻翻虫 · bloxorz-mini</title>
    <style>
      html, body { margin: 0; height: 100%; background: #5a0d10; overflow: hidden; font-family: "Smiley Sans", "得意黑", "Alibaba PuHuiTi", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; touch-action: none; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; left: 0; right: 0; top: 0; z-index: 5;
        display: flex; justify-content: space-between; align-items: flex-start;
        padding: calc(12px + env(safe-area-inset-top)) 14px 0;
        color: #e8eef7; pointer-events: none;
      }
      #hud .left, #hud .right { pointer-events: auto; }
      #hud .title { font-size: 18px; font-weight: 800; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
      #hud .sub { font-size: 13px; opacity: 0.75; margin-top: 4px; }
      button {
        appearance: none; border: 0; border-radius: 12px;
        background: rgba(255,255,255,0.94); color: #1a1a1a; box-shadow: 0 3px 0 rgba(0,0,0,.25);
        padding: 10px 14px; font-size: 14px; font-weight: 600;
        margin-left: 8px; cursor: pointer;
      }
      button:active { transform: scale(0.97); }
      #toast {
        position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
        transform: translateX(-50%); z-index: 6;
        background: rgba(20, 28, 40, 0.92); color: #fff;
        padding: 10px 16px; border-radius: 999px; font-size: 14px;
        opacity: 0; transition: opacity .2s; pointer-events: none;
      }
      #toast.show { opacity: 1; }
      #menu {
        position: fixed; inset: 0; z-index: 10;
        background: rgba(8, 12, 18, 0.82);
        display: flex; align-items: center; justify-content: center;
        padding: 16px;
      }
      #menu.hidden { display: none; }
      .panel {
        width: min(420px, 100%); max-height: min(90vh, 760px); overflow: auto;
        background: #1a2332; border-radius: 20px; padding: 22px 18px 18px;
        color: #e8eef7; box-shadow: 0 20px 60px rgba(0,0,0,.45);
      }
      .panel h1 { margin: 0; font-size: 28px; text-align: center; }
      .panel .hint { text-align: center; color: #8c9bb4; margin: 8px 0 18px; font-size: 13px; }
      .section { color: #8c9bb4; font-size: 13px; margin: 14px 0 8px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        flex: 1 1 30%; min-width: 96px; text-align: center;
        background: #243044; border-radius: 12px; padding: 12px 8px;
        font-size: 14px; font-weight: 600; cursor: pointer; border: 2px solid transparent;
      }
      .chip.active { border-color: #5B8CFF; background: #2a3d5f; }
      .desc { color: #8c9bb4; font-size: 12px; margin: 12px 0; min-height: 36px; line-height: 1.45; }
      .play {
        width: 100%; margin: 8px 0 0; padding: 14px; border-radius: 14px;
        background: #5B8CFF; color: white; font-size: 16px;
      }
      .note { color: #6b7a93; font-size: 11px; text-align: center; margin-top: 12px; line-height: 1.4; }

        <div class="chips">
          <div class="chip" id="btnAd">看广告+扒边</div>
